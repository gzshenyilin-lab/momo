<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机销售记账与串号管理系统 (终极全功能云端版)</title>
    <!-- 全部采用 jsDelivr 官方高速镜像，确保 Vue3、Supabase 和包含 BrowserBarcodeReader 的完整版 ZXing 100% 正常加载 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="app" v-cloak class="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- ================= 1. 登录/注册界面 (未登录时显示) ================= -->
        <div v-if="!isLoggedIn" class="min-h-[80vh] flex items-center justify-center">
            <div class="bg-white p-8 rounded-2xl shadow-md max-w-md w-full space-y-6 border border-gray-100">
                <div class="text-center space-y-2">
                    <div class="text-4xl">📱</div>
                    <h1 class="text-xl font-bold text-blue-600">手机销售记账与串号管理系统</h1>
                    <p class="text-xs text-gray-500">多端云端实时同步版 | 🕒 {{ currentTime }}</p>
                </div>

                <div class="flex bg-gray-100 p-1 rounded-lg text-xs">
                    <button @click="authMode = 'login'" :class="authMode === 'login' ? 'bg-white text-blue-600 shadow-sm font-bold' : 'text-gray-600'" class="flex-1 py-2 rounded transition">账号登录</button>
                    <button @click="authMode = 'register'" :class="authMode === 'register' ? 'bg-white text-blue-600 shadow-sm font-bold' : 'text-gray-600'" class="flex-1 py-2 rounded transition">内部注册</button>
                </div>

                <!-- 登录表单 -->
                <div v-if="authMode === 'login'" class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">系统用户名</label>
                        <input v-model="loginForm.username" @keyup.enter="handleLogin" type="text" placeholder="输入用户名（如 yilin）" class="border p-2.5 rounded-lg w-full text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">登录密码</label>
                        <input v-model="loginForm.password" @keyup.enter="handleLogin" type="password" placeholder="输入密码" class="border p-2.5 rounded-lg w-full text-sm">
                    </div>
                    <button @click="handleLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium transition text-sm">立即登录系统</button>
                </div>

                <!-- 注册表单 -->
                <div v-if="authMode === 'register'" class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">新用户名</label>
                        <input v-model="registerForm.username" type="text" placeholder="设置您的系统账号名称" class="border p-2.5 rounded-lg w-full text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">设置密码</label>
                        <input v-model="registerForm.password" type="password" placeholder="设置登录密码" class="border p-2.5 rounded-lg w-full text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">内部授权注册码 <span class="text-red-500">*</span></label>
                        <input v-model="registerForm.inviteCode" type="password" placeholder="输入内部授权码才可注册" class="border p-2.5 rounded-lg w-full text-sm">
                    </div>
                    <button @click="handleRegister" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-medium transition text-sm">确认注册并登录</button>
                </div>
            </div>
        </div>

        <!-- ================= 2. 主系统界面 (登录成功后显示) ================= -->
        <div v-else class="space-y-6">
            <!-- 顶部标题、实时时间、同步状态与操作员信息 -->
            <header class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm gap-3">
                <div class="flex items-center gap-2">
                    📱 <h1 class="text-xl font-bold text-blue-600">手机销售记账助手</h1>
                    <span class="bg-green-50 text-green-600 border border-green-200 text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-ping"></span> 云端实时同步中
                    </span>
                </div>
                <div class="flex items-center gap-2 sm:gap-3 flex-wrap justify-end">
                    <span class="text-xs bg-gray-100 text-gray-700 px-2.5 py-1 rounded-lg font-mono">🕒 {{ currentTime }}</span>
                    <button @click="fetchCloudData(true)" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-2.5 py-1 rounded-lg transition" title="手动强制从云端拉取最新数据">🔄 刷新同步</button>
                    <div class="flex items-center gap-1 bg-gray-50 px-2.5 py-1 rounded-lg border">
                        <span class="text-xs text-gray-500">当前账号:</span>
                        <span class="text-blue-600 font-bold text-sm">{{ currentUser }}</span>
                        <span v-if="isCurrentAdmin" class="bg-red-100 text-red-600 text-[10px] px-1.5 py-0.5 rounded font-bold ml-1">👑 管理员</span>
                        <span v-else class="bg-gray-200 text-gray-600 text-[10px] px-1.5 py-0.5 rounded ml-1">普通用户</span>
                    </div>
                    <button @click="handleLogout" class="text-xs text-red-500 hover:bg-red-50 border border-red-200 px-2.5 py-1 rounded-lg transition">退出</button>
                </div>
            </header>

            <!-- 全局摄像头扫码弹窗层 (支持实时视频流扫码 + 切换前后镜头 + 系统相机拍照识码兜底) -->
            <div v-if="isScanning" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                <div class="bg-gray-900 p-5 rounded-2xl max-w-sm w-full text-center space-y-4 border border-gray-700 shadow-2xl">
                    <div class="text-white text-sm font-bold flex items-center justify-center gap-2">
                        <span class="px-2 py-0.5 rounded text-xs" :class="scanMode === 'outbound' ? 'bg-green-600' : 'bg-blue-600'">
                            {{ scanMode === 'outbound' ? '⚡ 扫码出库模式' : '➕ 扫码入库模式' }}
                        </span>
                        <span>请将条形码/IMEI对准取景框</span>
                    </div>

                    <div class="relative mx-auto overflow-hidden rounded-xl bg-black border-2" :class="scanMode === 'outbound' ? 'border-green-500' : 'border-blue-500'">
                        <video id="scanner-video" class="w-full h-56 object-cover" playsinline muted></video>
                    </div>

                    <!-- 多摄像头切换与系统相机拍照兜底 -->
                    <div class="flex gap-2 justify-center">
                        <button v-if="videoDevices.length > 1" @click="switchCamera" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                            🔄 切换镜头 ({{ currentCameraIndex + 1 }}/{{ videoDevices.length }})
                        </button>
                        <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer transition inline-flex items-center gap-1">
                            📸 拍照/选图识别
                            <input type="file" accept="image/*" capture="environment" @change="handleImageScan" class="hidden">
                        </label>
                    </div>

                    <p class="text-xs text-gray-400">
                        {{ scanMode === 'outbound' ? '识别成功后将自动匹配在库商品并跳转开单' : '识别成功后将自动填入串号输入框' }}
                    </p>
                    <button @click="stopScan" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-sm font-medium transition">关闭摄像头</button>
                </div>
            </div>

            <!-- 选项卡切换 -->
            <div class="flex space-x-1 sm:space-x-2 overflow-x-auto pb-1">
                <button @click="currentTab = 'inventory'" :class="currentTab === 'inventory' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'" class="flex-1 py-2.5 px-3 rounded-lg font-medium shadow-sm transition text-xs sm:text-sm whitespace-nowrap">📦 库存与串号</button>
                <button @click="currentTab = 'detailInventory'" :class="currentTab === 'detailInventory' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'" class="flex-1 py-2.5 px-3 rounded-lg font-medium shadow-sm transition text-
